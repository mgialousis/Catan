# Phase 7: free services only; deploy manually between games.
services:
  - type: web
    name: island-table-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TLS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      # Measured 2026-09-27 with the ingress probe (apps/server/src/ingress.ts):
      # Render's proxy reaches the app over loopback and appends the client to
      # X-Forwarded-For, where both cf-connecting-ip and true-client-ip sit at
      # the last entry. A forged X-Forwarded-For stays in front of it, so one hop
      # selects the real client and ignores the forgery. Zero keyed every player
      # to the loopback address. Re-measure if the ingress path changes.
      - key: TRUSTED_PROXY_HOPS
        value: "1"
  - type: web
    name: island-table-web
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: bash scripts/build-web.sh
    staticPublishPath: ./apps/mobile/build/web
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
