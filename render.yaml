# Phase 7: free services only; deploy manually between games.
services:
  - type: web
    name: island-table-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/server/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TLS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: WEB_ORIGINS
        sync: false
      # Leave unset/zero until actual ingress forwarding is measured.
      - key: TRUSTED_PROXY_HOPS
        value: "0"
  - type: web
    name: island-table-web
    runtime: static
    autoDeployTrigger: "off"
    buildCommand: bash scripts/build-web.sh
    staticPublishPath: ./apps/mobile/build/web
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: API_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
